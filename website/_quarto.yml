project:
  type: website
  output-dir: _site
  render:
    - index.qmd
  resources:
    - assets/**

website:
  title: "Jiawei’s Projects"
  site-url: https://jiaweitang22.github.io/cs180-proj3/
  navbar:
    background: light
    left:
      - href: index.qmd
        text: CS 180 Project 3
      - href: index.qmd#setup
        text: Part A
    right:
      - icon: github
        href: https://github.com/jiaweitang22/cs180-proj3
        aria-label: GitHub repository
  search: true
  page-footer:
    left: "Jiawei Tang · CS 180 · Fall 2026"
    right: "Built with Quarto"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-title: On this page
    toc-depth: 3
    toc-expand: 2
    smooth-scroll: true
    html-math-method: mathjax
    link-external-newwindow: true
    code-copy: true
    anchor-sections: true
    include-after-body: interactions.html
    grid:
      body-width: 800px
      margin-width: 230px

execute:
  enabled: false
